name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust + targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Android SDK (manual) + NDK
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/ct.zip
          unzip -q /tmp/ct.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          # Template Tauri atual: compileSdk 37 / AGP 9.3 / build-tools até 37.
          # Instala o que existir (|| true evita falhar num pacote ausente).
          for p in "platform-tools" "platforms;android-34" "platforms;android-35" \
                   "platforms;android-36" "platforms;android-37" \
                   "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0" \
                   "build-tools;37.0.0" "ndk;27.0.12077973"; do
            sdkmanager --install "$p" >/dev/null || echo "skip: $p"
          done
          sdkmanager --list_installed | head -20
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # AGP 9 exige UMA única origem de SDK: alinha a ANDROID_SDK_ROOT
          # pré-definida do runner (senão: "Several environment variables
          # ... contain different paths to the SDK")
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Ícones (todas as densidades)
        run: cargo tauri icon app-icon.png

      - name: Inicializar projeto Android (gen/)
        run: cargo tauri android init

      - name: Build APK (debug, aarch64)
        run: |
          set -o pipefail
          cargo tauri android build --target aarch64 --debug --apk 2>&1 | tee build.log

      - name: Log completo (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Localizar APK
        id: apk
        run: echo "path=$(find src-tauri/gen/android -name '*.apk' -type f | head -1)" >> "$GITHUB_OUTPUT"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PetClawd-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
