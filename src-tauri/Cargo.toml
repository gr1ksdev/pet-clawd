[package]
name = "clawd-pet-app"
version = "1.0.0"
description = "Pet Clawd — app Android do pet pixelado (port do plugin clawd_pet_pt)"
authors = ["ටී𝒆𝒏𝒛𝒖"]
edition = "2021"

[lib]
name = "clawd_pet_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
